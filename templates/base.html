<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .content {
            background-color: white;
            padding: 20px;
            margin-top: 20px;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }

        /* Alert styles for notification template */
        .alert {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 20px 0;
        }

        .alert-title {
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
    {% block extra_styles %}{% endblock %}
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>{% block header %}Email System{% endblock %}</h1>
        </div>

        <div class="content">
            {% block content %}{% endblock %}
        </div>

        <div class="footer">
            <p>{% block footer %}Este es un email automático. No respondas a este mensaje.{% endblock %}</p>
        </div>
    </div>
</body>

</html>
